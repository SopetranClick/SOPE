spring.application.name=sopetran-click

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=sopetranclick
spring.datasource.username=postgres
spring.datasource.password=tu_contraseña
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Quitar el dialecto hardcodeado — Hibernate lo detecta solo (evita el warning HHH90000025)
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Forzar el schema en Hibernate también (necesario además de la URL)
spring.jpa.properties.hibernate.default_schema=SopetranClick